[package]
name = "caustic"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "GPU-accelerated physics simulation engine, starting with general-relativistic Kerr black holes"
license = "MIT"
repository = "https://github.com/grunclepug/caustic"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
anyhow = "1.0.105"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.9", features = ["derive"] }
env_logger = { version = "0.11.12", default-features = false, features = ["auto-color", "humantime"] }
glam = "0.34.3"
log = "0.4.35"
png = "0.18.1"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
winit = "0.30.13"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
strip = true
lto = "thin"
