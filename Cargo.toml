[workspace]
resolver = "3"
members = [
    "crates/caustic-core",
    "crates/caustic-blackhole",
    "crates/caustic-photons",
    "crates/caustic-app",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/grunclepug/caustic"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
anyhow = "1.0.105"
bytemuck = { version = "1.25.2", features = ["derive"] }
clap = { version = "4.6.9", features = ["derive"] }
env_logger = { version = "0.11.12", default-features = false, features = ["auto-color", "humantime"] }
glam = "0.34.3"
log = "0.4.35"
png = "0.18.1"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
winit = "0.30.13"

caustic-core = { path = "crates/caustic-core" }
caustic-blackhole = { path = "crates/caustic-blackhole" }
caustic-photons = { path = "crates/caustic-photons" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 2

[profile.release]
strip = true
lto = "thin"
